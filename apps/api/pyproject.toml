[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-api"
version = "0.1.0"
description = "Nexus API service: ingestion, hybrid retrieval, reranking, and RAG orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<1.14",
    "redis>=5.0,<6",
    "rq>=1.16,<2",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.8,<3",
    "email-validator>=2.1,<3",
    "python-multipart>=0.0.9,<0.1",
    "pypdf>=6.0,<7",
    "sentence-transformers>=3.0,<4",
    "qdrant-client>=1.11,<1.12",
    "google-genai>=2.0,<3",
    "langgraph>=1.2,<1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.11",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6",
    # google-genai requires httpx>=0.28.1; bumped from 0.27 for that reason.
    # Tests already use the httpx>=0.28-compatible ASGITransport pattern
    # (not the removed AsyncClient(app=...) shortcut), so this is safe.
    "httpx>=0.28.1,<0.29",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` (and the
# same for Header/Query/Path/Body/Cookie) -- these calls are meant to be
# evaluated once per parameter default, not treated as a mutable-default
# footgun, so they're exempted from B008 rather than rewritten per call site.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async engine bridges its traditionally-sync Core/ORM
# internals into asyncio via greenlet (see sqlalchemy.util.concurrency).
# Without telling coverage.py about that, its default sys.settrace-based
# tracer silently stops recording lines once execution crosses a greenlet
# switch (e.g. right after any `await session.execute(...)` /
# `await session.flush()` / `await session.commit()`), which under-reports
# coverage for every route and dependency that touches the database.
concurrency = ["greenlet", "thread"]
# app/workers/worker.py is the RQ process entrypoint: it constructs a Redis
# connection, a Queue, and a Worker, then calls worker.work(), which blocks
# forever polling for jobs. There is no meaningful assertion a test could
# make about it beyond "the constructors were called with some arguments,
# then wired to a mocked and never-called .work()" -- that would exercise
# no real behavior, just restate the four lines of the function in mock
# form (see issue #19's guidance against padding coverage with tautological
# tests). Every module it delegates actual work to (chunking_service,
# embedding_service, vector_store_service, app.workers.jobs.process_document)
# is already covered by real tests elsewhere; this file is excluded from
# the coverage measurement entirely rather than counted against fail_under
# below.
omit = ["app/workers/worker.py"]

[tool.coverage.report]
# Measured on this repo's actual test suite (real Postgres + Qdrant + real
# embeddings, see docs/TDD.md section 6) as of issue #19: 100% of every
# statement outside the omitted app/workers/worker.py entrypoint above.
# fail_under is set a few points under that, not at the literal 100% just
# achieved, for two reasons: first, the CI runner and local development can
# differ in minor Python patch version, and coverage.py's line-level
# tracing has occasionally shown small discrepancies across interpreter
# versions for edge cases like multi-line statements or comprehensions --
# a razor-thin 100% gate would be one such discrepancy away from a false-
# positive CI failure unrelated to any real regression. Second, and more
# importantly, a gate pinned to the exact number just measured invites
# exactly the kind of tautological, gate-satisfying test issue #19 warns
# against for every future change (chasing the last fractional percent
# rather than testing something real). 98% is high enough to catch an
# actual regression (a new module or a large new branch landing with no
# tests at all) while leaving legitimate room for a future PR's own
# defensive/hard-to-reach edge cases without every single one needing to be
# a change to this threshold.
fail_under = 98
